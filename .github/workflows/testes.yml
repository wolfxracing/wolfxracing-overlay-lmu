name: Testes (Windows nativo e offscreen)

# Roda TODAS as suites do pacote (rodar_todos_os_testes.py: um processo por suite, codigo de saida por suite)
# no Windows, com a plataforma Qt nativa ("windows") e sem tela ("offscreen"). Nao substitui a homologacao em simulador real.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 90
    # 'offscreen' no Windows roda com as fontes do Windows (QT_QPA_FONTDIR); segue informativo: o resultado que vale e o do Qt nativo ('windows')
    continue-on-error: ${{ matrix.plataforma == 'offscreen' }}
    strategy:
      fail-fast: false
      matrix:
        plataforma: [windows, offscreen]
    defaults:
      run:
        shell: pwsh
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # historico e tags: o teste da Classificacao compara a aparencia padrao com a da tag v1.8.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de teste
        run: python -m pip install --only-binary ":all:" -r requirements-teste.txt
      - name: Rodar todas as suites
        run: |
          # build bb: o 'offscreen' do Windows nao enxerga NENHUMA fonte do sistema (diagnostico: 0 familias); com QT_QPA_FONTDIR ele passa a ver
          # as mesmas fontes do Qt nativo e as 4 suites que falhavam passam sem alterar nenhuma verificacao.
          if ("${{ matrix.plataforma }}" -eq "offscreen") { $env:QT_QPA_FONTDIR = "C:\Windows\Fonts" }
          python rodar_todos_os_testes.py --plataforma ${{ matrix.plataforma }} --timeout 1500
      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs_testes_${{ matrix.plataforma }}
          path: overlay/logs_testes/

  # build bb (P2.3): diagnostico das suites que falham no 'offscreen' do Windows. Mesmo Windows, mesmas suites; so muda a origem das fontes:
  # com QT_QPA_FONTDIR apontando para as fontes do Windows, o 'offscreen' passa a enxergar Bahnschrift/Segoe UI como o Qt nativo.
  # Informativo (continue-on-error); o resultado que vale continua sendo o do Qt nativo.
  diagnostico_offscreen:
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de teste
        run: python -m pip install --only-binary ":all:" -r requirements-teste.txt
      - name: Fontes que cada plataforma Qt enxerga
        run: |
          New-Item -ItemType Directory -Force diag | Out-Null
          $env:QT_QPA_PLATFORM = "windows";   python ../tools/diagnostico_fontes_qt.py diag/fontes_windows.json | Out-Null
          $env:QT_QPA_PLATFORM = "offscreen"; python ../tools/diagnostico_fontes_qt.py diag/fontes_offscreen.json | Out-Null
          $env:QT_QPA_FONTDIR = "C:\Windows\Fonts"; python ../tools/diagnostico_fontes_qt.py diag/fontes_offscreen_fontdir.json | Out-Null
          Remove-Item Env:QT_QPA_FONTDIR
          foreach ($n in "windows","offscreen","offscreen_fontdir") { $j = Get-Content "diag/fontes_$n.json" -Raw | ConvertFrom-Json; Write-Host ("{0,-18} familias={1} Bahnschrift={2} SegoeUI={3} padrao={4}; Bahnschrift resolve para {5} (exata={6}) largura_sonda={7}" -f $n, $j.n_familias, $j.tem.Bahnschrift, $j.tem.'Segoe UI', $j.fonte_padrao, $j.medidas[0].resolvida, $j.medidas[0].exata, $j.medidas[0].largura_sonda) }
      - name: As quatro suites no offscreen COM as fontes do Windows
        run: |
          $env:QT_QPA_FONTDIR = "C:\Windows\Fonts"
          foreach ($s in "teste_v170_estados_vazios","teste_v170_previa_opcoes","teste_v182_classif_foto_recorte","teste_v18_integracao") {
            python rodar_todos_os_testes.py --plataforma offscreen --so $s --timeout 1500
            Copy-Item logs_testes "diag/logs_$s" -Recurse -Force
          }
        continue-on-error: true
      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico_offscreen
          path: overlay/diag/
